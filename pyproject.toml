[project]
name = "learning-quantitative-trading"
version = "0.1.0"
description = "A 股量化交易学习脚手架：数据获取、向量化回测、绩效分析与策略模板"
readme = "README.md"
authors = [
    { name = "zexuan.peng", email = "pengzexuan2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.18.94",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.scripts]
qlt = "qlearn.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "qlearn"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 笔记本的代码单元按教学可读性排版：放宽行宽，并允许先做全局设置再导入
"*.ipynb" = ["E501", "E402"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
